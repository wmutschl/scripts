# Apple Mac mini M4 Pro (hostname mac-mini): configuration of the container runner gitea-runner
# (Gitea's runner, formerly act_runner), mounted read-only as /config.yaml.
# Every key is documented in `docker run --rm --entrypoint gitea-runner docker.gitea.com/runner:6.0.0 config generate`.
# Changes take effect with: docker compose up -d --force-recreate gitea-runner

log:
  level: info

runner:
  # Relative to /data, where the container's start script works; holds the runner's credentials
  file: .runner
  # Two jobs at a time. They share the gitea-ci network, so service containers with the same name
  # (for example two jobs that both start a "postgres" service) would collide; set 1 if your workflows use services.
  capacity: 2
  # Gitea also stops jobs after [actions] ENDLESS_TASK_TIMEOUT, 3 h by default; raise both for longer jobs
  timeout: 3h
  # The labels live here and nowhere else (not in GITEA_RUNNER_LABELS), as `runs-on` matches them.
  # The images are multi-arch, so jobs run as linux/arm64 on the M4 Pro.
  # For linux/amd64 under Rosetta, add `options: --platform linux/amd64` to a job's `container:`.
  labels:
    - "ubuntu-latest:docker://docker.gitea.com/runner-images:ubuntu-latest"
    - "ubuntu-26.04:docker://docker.gitea.com/runner-images:ubuntu-26.04"
    - "ubuntu-24.04:docker://docker.gitea.com/runner-images:ubuntu-24.04"
    - "ubuntu-22.04:docker://docker.gitea.com/runner-images:ubuntu-22.04"

cache:
  enabled: true
  # On the runner's volume, so the cache survives a recreated container
  dir: /data/cache
  # Job containers reach the cache server under the runner's name on the gitea-ci network
  host: gitea-runner
  port: 8088

container:
  # Every job container joins gitea-ci, where it reaches Gitea at http://gitea:3000 and the cache above.
  # The network must exist already: docker compose creates it.
  network: gitea-ci
  privileged: false
  # At most 8 GiB of memory and 4096 processes per job container, so that a runaway job cannot starve Gitea,
  # PostgreSQL and modCraft in OrbStack's VM. They do not cover `services:` containers or `docker://` steps,
  # and a workflow's own --memory option overrides them.
  options: --memory=8g --pids-limit=4096
  # Workflows may mount nothing from the host
  valid_volumes: []
  # "-": the runner itself uses OrbStack's Docker socket, but no job or action container gets it.
  # With the default "" every job could start privileged containers and read all volumes.
  docker_host: "-"
  # Mutable tags such as ubuntu-latest are refreshed before each job; a failed pull falls back to the local copy
  force_pull: true

host:
  # The runner's download cache of actions, on the volume as well
  workdir_parent: /data/act
