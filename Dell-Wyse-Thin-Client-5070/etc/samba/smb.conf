# Dell Wyse 5070 (hostname dell-wyse): one SMB share for Home Assistant's backups.
# Only the Raspberry Pi / Home Assistant box (192.168.178.50) may connect, only over SMB 3, only on the onboard NIC.
# Change enp1s0 if the interface has another name (ip -br link).
# UFW allows port 445 from the Pi only, as a second layer.
[global]
   server role = standalone server
   interfaces = lo enp1s0
   bind interfaces only = yes
   hosts allow = 127.0.0.1 192.168.178.50
   hosts deny = ALL
   server min protocol = SMB3
   smb ports = 445
   disable netbios = yes
   map to guest = never
   restrict anonymous = 2
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   logging = file
   log file = /var/log/samba/log.%m
   max log size = 1000

# Lands on the @ha-backups subvolume: snapshotted hourly,
# sent to HDD 1 nightly, mirrored off-site by dell-wyse-offsite.
[ha-backups]
   path = /srv/ha-backups
   valid users = hass-backup
   read only = no
   browseable = no
   create mask = 0600
   directory mask = 0700
