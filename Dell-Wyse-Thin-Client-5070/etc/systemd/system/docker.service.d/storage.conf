# Dell Wyse 5070 (hostname dell-wyse): Docker starts only on top of its BTRFS subvolumes.
# Without the mounts, its restart-policy containers would come up against empty directories on the root filesystem.
# /home holds ~/scripts, whose Tailscale folder the sidecar bind-mounts its serve configuration from.
[Unit]
RequiresMountsFor=/home /var/lib/docker /var/lib/containerd /srv/nextcloud
AssertPathIsMountPoint=/home
AssertPathIsMountPoint=/var/lib/docker
AssertPathIsMountPoint=/var/lib/containerd
AssertPathIsMountPoint=/srv/nextcloud
