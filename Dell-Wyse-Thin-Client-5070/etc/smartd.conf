# Dell Wyse 5070 (hostname dell-wyse): smartd configuration, installed as /etc/smartd.conf.
# Watches every disk smartd finds when it starts (the Vi560 and both USB HDDs):
# overall health, error and self-test logs, attribute changes, and temperature (logged at 55 °C, alert at 60 °C).
# Short self-test every Sunday at 11:00, long self-test on the 15th of each month at 11:00.
# Disks in standby are not woken for the half-hourly checks; HDD 2 is the exception (see below).
# Problems go to healthchecks.io through dell-wyse-smartd-alert instead of mail.
#
# A USB disk that smartd skips can be listed explicitly with -d sat.
# Explicit lines must come before DEVICESCAN, which then skips those disks, for example:
# /dev/disk/by-id/usb-YOUR-HDD -d removable -d sat -a -o on -S on -n standby,q -s (S/../../7/11|L/../15/./11) -W 4,55,60 -m <nomailer> -M exec /usr/local/sbin/dell-wyse-smartd-alert
# -d removable keeps smartd from exiting at startup when that disk is not attached.

# HDD 2 (Toshiba MQ04UBB400): its USB bridge cannot report standby, so smartd ignores -n
# and would wake the disk at every check. Check it every 6 hours instead; a self-test
# missed in between runs at the next check.
/dev/disk/by-id/usb-TOSHIBA_External_USB_3.0_20201028020375F-0:0 -d removable -d sat -a -o on -S on -c i=21600 -s (S/../../7/11|L/../15/./11) -W 4,55,60 -m <nomailer> -M exec /usr/local/sbin/dell-wyse-smartd-alert

DEVICESCAN -a -o on -S on -n standby,q -s (S/../../7/11|L/../15/./11) -W 4,55,60 -m <nomailer> -M exec /usr/local/sbin/dell-wyse-smartd-alert
