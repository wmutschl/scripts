# Dell Wyse 5070 (hostname dell-wyse): key-only SSH.
# sshd uses the first value it reads, and this file sorts before Ubuntu's own drop-ins.
# Local forwarding stays on for the break-glass tunnel to the AIO interface.
PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding local
