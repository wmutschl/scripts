# Dell Wyse 5070 (hostname dell-wyse): initrd for the LUKS-encrypted system SSD.
# Takes effect with: sudo update-initramfs -u -k all
#
# Host-only image. dracut then copies the crypttab entry for wyse-system,
# with its discard and x-initrd.attach options, plus root's account that dracut-sshd needs.
# Ubuntu builds generic images by default:
# they ignore crypttab and would open the SSD under a generated name.
hostonly="yes"

# dracut-sshd (46sshd in /usr/lib/dracut/modules.d, installed by the guide):
# OpenSSH in the initrd, for typing the passphrase at every boot.
# The networkd module brings up every wired interface by DHCP with the MAC as client ID,
# so the FRITZ!Box reservation applies.
# bash is root's login shell; Ubuntu's initrd otherwise has only dash as /bin/sh.
add_dracutmodules+=" systemd-networkd bash "
