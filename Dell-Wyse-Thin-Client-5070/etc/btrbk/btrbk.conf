# Dell Wyse 5070 (hostname dell-wyse): hourly snapshots on the Vi560
# and daily send/receive to HDD 1 (LUKS mapping wyse-btrbk, mounted at /mnt/btrbk).
# Run by dell-wyse-btrbk-snapshot.timer (btrbk snapshot) and dell-wyse-btrbk-send.timer (btrbk resume);
# the package's btrbk.timer stays disabled.
timestamp_format        long
transaction_log         /var/log/btrbk.log
lockfile                /run/lock/btrbk.lock

# On the SSD: 48 hourly and 7 daily snapshots
snapshot_dir            @snapshots
snapshot_preserve_min   2h
snapshot_preserve       48h 7d

# On HDD 1: 30 daily, 12 weekly and 12 monthly copies
target_preserve_min     no
target_preserve         30d 12w 12m

# /mnt/wyse-top is the filesystem's top level (subvolid=5).
# @containerd holds only downloadable images and is left out, as is @snapshots itself.
volume /mnt/wyse-top
  target /mnt/btrbk/wyse
  subvolume @root
  subvolume @home
  subvolume @docker
  subvolume @nextcloud
  subvolume @ha-backups
